name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Podesi Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Podesi Android SDK
        uses: android-actions/setup-android@v3

      - name: Instaliraj Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Napravi APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Preimenuj APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Fizika 1 – inicijalni test.apk"

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: Fizika 1 – inicijalni test
          path: "app/build/outputs/apk/debug/Fizika 1 – inicijalni test.apk"
          if-no-files-found: error
