name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "redesign-fizika1-home", "fizika1-final-hero-fix" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi projekat
        uses: actions/checkout@v4

      - name: Podesi JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Podesi Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Podesi Android SDK
        uses: android-actions/setup-android@v3

      - name: Instaliraj Android SDK 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Obnovi odobrenu HD hero sliku
        run: |
          cat app/src/main/res/drawable-nodpi/fizika1_hero_fixed_b64.txt app/src/main/res/drawable-nodpi/hero_hd_01.txt | base64 -d > app/src/main/res/drawable-nodpi/fizika1_hero.jpg
          rm -f app/src/main/res/drawable-nodpi/fizika1_hero_fixed_b64.txt
          rm -f app/src/main/res/drawable-nodpi/hero_hd_01.txt
          rm -f app/src/main/res/drawable-nodpi/fizika1_hero_fixed.jpg
          file app/src/main/res/drawable-nodpi/fizika1_hero.jpg
          test -s app/src/main/res/drawable-nodpi/fizika1_hero.jpg

      - name: Napravi APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Proveri hero sliku u APK-u
        run: |
          rm -rf /tmp/apkcheck
          mkdir -p /tmp/apkcheck
          unzip -q app/build/outputs/apk/debug/app-debug.apk -d /tmp/apkcheck
          file /tmp/apkcheck/res/drawable-nodpi-v4/fizika1_hero.jpg
          test -s /tmp/apkcheck/res/drawable-nodpi-v4/fizika1_hero.jpg

      - name: Preimenuj APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/Fizika 1 – inicijalni test.apk"

      - name: Sačuvaj APK
        uses: actions/upload-artifact@v4
        with:
          name: Fizika 1 – inicijalni test
          path: "app/build/outputs/apk/debug/Fizika 1 – inicijalni test.apk"
          if-no-files-found: error
